name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check if release (tag-based, merge-strategy independent)
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # pr-validation forbids version bumps on non-release branches, so an
          # unpublished version on master IS a release — regardless of how the
          # commits landed (merge commit / squash / rebase / batched merges,
          # where workflows only run for the final push).
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup
        if: steps.check.outputs.is_release == 'true'
        run: npm ci

      - name: Build and test
        if: steps.check.outputs.is_release == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Read version
        if: steps.check.outputs.is_release == 'true'
        id: version
        run: echo "version=${{ steps.check.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Check if prerelease
        if: steps.check.outputs.is_release == 'true'
        id: pre
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.is_release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Publish
        if: steps.check.outputs.is_release == 'true'
        run: npm publish --tag ${{ steps.pre.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.is_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.pre.outputs.prerelease }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            See [commits since last tag](https://github.com/${{ github.repository }}/commits/v${{ steps.version.outputs.version }})
